<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
      
      .terminal-bg {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 10px;
      }
      
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      
      .term-title {
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        fill: #8b949e;
        font-weight: 600;
      }
      
      .prompt-user { fill: #58a6ff; font-weight: 700; }
      .prompt-host { fill: #7ee787; font-weight: 700; }
      .prompt-sep { fill: #c9d1d9; }
      .info-key { fill: #79c0ff; font-weight: 600; }
      .info-val { fill: #c9d1d9; }
      .info-accent { fill: #ffa657; font-weight: 600; }
      .info-toppings { fill: #ff7b72; font-weight: 600; }

      .ascii-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 10px;
        white-space: pre;
      }
      
      /* Colors for Pizza ASCII components */
      .c-crust { fill: #d97706; font-weight: 700; } /* Golden brown crust */
      .c-crust-light { fill: #f59e0b; font-weight: 700; }
      .c-cheese { fill: #fbbf24; font-weight: 500; } /* Melted yellow cheese */
      .c-pep { fill: #ef4444; font-weight: 700; } /* Red pepperoni */
      .c-herb { fill: #22c55e; font-weight: 700; } /* Basil / Herbs green */
      .c-steam { fill: #94a3b8; font-weight: 400; }
      
      /* Keyframe Animations */
      @keyframes spinPizza {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes steamFloat {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(-7px); opacity: 0.9; }
        100% { transform: translateY(-14px); opacity: 0; }
      }

      .spin-container {
        transform-origin: 155px 180px;
        animation: spinPizza 14s linear infinite;
      }

      .steam-group {
        animation: steamFloat 3.5s ease-in-out infinite;
      }

      /* Light mode adaptation */
      @media (prefers-color-scheme: light) {
        .terminal-bg {
          fill: #ffffff;
          stroke: #d0d7de;
        }
        .term-title { fill: #57606a; }
        .prompt-user { fill: #0969da; }
        .prompt-host { fill: #1a7f37; }
        .prompt-sep { fill: #24292f; }
        .info-key { fill: #0550ae; }
        .info-val { fill: #24292f; }
        .c-steam { fill: #57606a; }
      }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect x="10" y="10" width="600" height="310" class="terminal-bg" />
  
  <!-- Window Controls -->
  <circle cx="30" cy="28" r="5.5" class="dot-red" />
  <circle cx="46" cy="28" r="5.5" class="dot-yellow" />
  <circle cx="62" cy="28" r="5.5" class="dot-green" />
  <text x="310" y="32" text-anchor="middle" class="term-title">seiya@github: ~/pizza-fetch</text>

  <!-- Header Separator Line -->
  <line x1="10" y1="46" x2="610" y2="46" stroke="#30363d" stroke-width="1" />

  <!-- Left Side: Rising Steam -->
  <g transform="translate(155, 62)" class="steam-group">
    <text class="ascii-text c-steam" text-anchor="middle" y="0">~   (   ~   )   ~</text>
    <text class="ascii-text c-steam" text-anchor="middle" y="10"> (    ~    ) </text>
  </g>

  <!-- Rotating Pizza Group -->
  <g class="spin-container">
    <g transform="translate(155, 180)">
      <!-- Line -90 -->
      <text class="ascii-text" text-anchor="middle" y="-90">
        <tspan class="c-crust">. : + * # # # # # # # # * + : .</tspan>
      </text>
      <!-- Line -78 -->
      <text class="ascii-text" text-anchor="middle" y="-78">
        <tspan class="c-crust">: # #</tspan><tspan class="c-cheese"> = = = = = = = = = = = = = </tspan><tspan class="c-crust"># # :</tspan>
      </text>
      <!-- Line -66 -->
      <text class="ascii-text" text-anchor="middle" y="-66">
        <tspan class="c-crust">+ #</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-pep">/@\</tspan><tspan class="c-cheese"> = = = </tspan><tspan class="c-herb">*</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-pep">/@\</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-crust"># +</tspan>
      </text>
      <!-- Line -54 -->
      <text class="ascii-text" text-anchor="middle" y="-54">
        <tspan class="c-crust">* #</tspan><tspan class="c-cheese"> = </tspan><tspan class="c-pep">|@@@|</tspan><tspan class="c-cheese"> = = = = = = = </tspan><tspan class="c-pep">|@@@|</tspan><tspan class="c-cheese"> = </tspan><tspan class="c-crust"># *</tspan>
      </text>
      <!-- Line -42 -->
      <text class="ascii-text" text-anchor="middle" y="-42">
        <tspan class="c-crust"># #</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-pep">\@/</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-pep">/@\</tspan><tspan class="c-cheese"> = = = </tspan><tspan class="c-pep">\@/</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-crust"># #</tspan>
      </text>
      <!-- Line -30 -->
      <text class="ascii-text" text-anchor="middle" y="-30">
        <tspan class="c-crust"># #</tspan><tspan class="c-cheese"> = </tspan><tspan class="c-herb">*</tspan><tspan class="c-cheese"> = = = = </tspan><tspan class="c-pep">|@@@|</tspan><tspan class="c-cheese"> = = = = </tspan><tspan class="c-herb">*</tspan><tspan class="c-cheese"> = </tspan><tspan class="c-crust"># #</tspan>
      </text>
      <!-- Line -18 -->
      <text class="ascii-text" text-anchor="middle" y="-18">
        <tspan class="c-crust"># #</tspan><tspan class="c-cheese"> = = = </tspan><tspan class="c-pep">/@\</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-pep">\@/</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-pep">/@\</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-crust"># #</tspan>
      </text>
      <!-- Line -6 -->
      <text class="ascii-text" text-anchor="middle" y="-6">
        <tspan class="c-crust"># #</tspan><tspan class="c-cheese"> = = = </tspan><tspan class="c-pep">|@@@|</tspan><tspan class="c-cheese"> = = = = = = </tspan><tspan class="c-pep">|@@@|</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-crust"># #</tspan>
      </text>
      <!-- Line 6 -->
      <text class="ascii-text" text-anchor="middle" y="6">
        <tspan class="c-crust"># #</tspan><tspan class="c-cheese"> = = = </tspan><tspan class="c-pep">\@/</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-herb">*</tspan><tspan class="c-cheese"> = = = </tspan><tspan class="c-pep">\@/</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-crust"># #</tspan>
      </text>
      <!-- Line 18 -->
      <text class="ascii-text" text-anchor="middle" y="18">
        <tspan class="c-crust"># #</tspan><tspan class="c-cheese"> = </tspan><tspan class="c-herb">*</tspan><tspan class="c-cheese"> = = = = = = = = = = = = = = </tspan><tspan class="c-crust"># #</tspan>
      </text>
      <!-- Line 30 -->
      <text class="ascii-text" text-anchor="middle" y="30">
        <tspan class="c-crust"># #</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-pep">/@\</tspan><tspan class="c-cheese"> = = = = = </tspan><tspan class="c-pep">/@\</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-crust"># #</tspan>
      </text>
      <!-- Line 42 -->
      <text class="ascii-text" text-anchor="middle" y="42">
        <tspan class="c-crust">* #</tspan><tspan class="c-cheese"> = </tspan><tspan class="c-pep">|@@@|</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-herb">*</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-pep">|@@@|</tspan><tspan class="c-cheese"> = </tspan><tspan class="c-crust"># *</tspan>
      </text>
      <!-- Line 54 -->
      <text class="ascii-text" text-anchor="middle" y="54">
        <tspan class="c-crust">+ #</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-pep">\@/</tspan><tspan class="c-cheese"> = = = = = = </tspan><tspan class="c-pep">\@/</tspan><tspan class="c-cheese"> = = </tspan><tspan class="c-crust"># +</tspan>
      </text>
      <!-- Line 66 -->
      <text class="ascii-text" text-anchor="middle" y="66">
        <tspan class="c-crust">: # #</tspan><tspan class="c-cheese"> = = = = = = = = = = = = = </tspan><tspan class="c-crust"># # :</tspan>
      </text>
      <!-- Line 78 -->
      <text class="ascii-text" text-anchor="middle" y="78">
        <tspan class="c-crust">' : + * # # # # # # # # * + : '</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side: Neofetch Style Linux Distro Info -->
  <g transform="translate(320, 75)">
    <!-- User Prompt Header -->
    <text class="ascii-text" x="0" y="0">
      <tspan class="prompt-user">seiya</tspan><tspan class="prompt-sep">@</tspan><tspan class="prompt-host">github</tspan>
    </text>
    <text class="ascii-text" x="0" y="14" fill="#58a6ff">----------------------------------</text>

    <!-- Info Lines -->
    <text class="ascii-text" x="0" y="36">
      <tspan class="info-key">OS: </tspan><tspan class="info-val">SeiyaOS x86_64 (Linux 6.8-pizza)</tspan>
    </text>
    <text class="ascii-text" x="0" y="54">
      <tspan class="info-key">Host: </tspan><tspan class="info-val">Lassonde School CS Graduate</tspan>
    </text>
    <text class="ascii-text" x="0" y="72">
      <tspan class="info-key">Uptime: </tspan><tspan class="info-val">24/7 (Building &amp; Shipping)</tspan>
    </text>
    <text class="ascii-text" x="0" y="90">
      <tspan class="info-key">Shell: </tspan><tspan class="info-val">zsh 5.9 (x86_64-apple-darwin)</tspan>
    </text>
    <text class="ascii-text" x="0" y="108">
      <tspan class="info-key">Editor: </tspan><tspan class="info-val">Neovim / VS Code</tspan>
    </text>
    <text class="ascii-text" x="0" y="126">
      <tspan class="info-key">Stack: </tspan><tspan class="info-val">Python, JS, HTML/CSS, C++</tspan>
    </text>
    <text class="ascii-text" x="0" y="144">
      <tspan class="info-key">Favorite Topping: </tspan><tspan class="info-toppings">Extra Cheese &amp; Pepperoni 🍕</tspan>
    </text>
    <text class="ascii-text" x="0" y="162">
      <tspan class="info-key">Status: </tspan><tspan class="info-accent">Spinning clean code &amp; fresh slices</tspan>
    </text>

    <!-- Terminal Color Blocks -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="16" height="12" fill="#21262d" rx="2" />
      <rect x="20" y="0" width="16" height="12" fill="#ff7b72" rx="2" />
      <rect x="40" y="0" width="16" height="12" fill="#7ee787" rx="2" />
      <rect x="60" y="0" width="16" height="12" fill="#ffa657" rx="2" />
      <rect x="80" y="0" width="16" height="12" fill="#79c0ff" rx="2" />
      <rect x="100" y="0" width="16" height="12" fill="#d2a8ff" rx="2" />
      <rect x="120" y="0" width="16" height="12" fill="#a5d6ff" rx="2" />
      <rect x="140" y="0" width="16" height="12" fill="#f0f6fc" rx="2" />
    </g>
  </g>
</svg>